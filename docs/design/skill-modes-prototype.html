<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호출 방식 · 스킬 대시보드 (시안)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect x='1' y='12' width='4' height='9' rx='1' fill='%23b35c08'/%3E%3Crect x='7' y='7' width='4' height='14' rx='1' fill='%23b35c08'/%3E%3Crect x='13' y='3' width='4' height='18' rx='1' fill='%230a766c'/%3E%3C/svg%3E">
<style>
  /* ---------- tokens: the same as kit/user/skill-dashboard.html ---------- */
  /* amber = costs tokens on every request (auto), teal = only when called (manual), hollow = off.
     Agent colors: four validated slots; the other agents carry a name badge only. */
  :root {
    --paper: #f3f4f7; --surface: #ffffff; --raised: #f8f9fb; --ink: #14161b; --ink-2: #3a404c; --muted: #5b6270; --faint: #8a919e;
    --line: #e2e5ea; --line-2: #cfd4dc; --accent: #2f4bc0; --accent-soft: #e8ecfb;
    --always: #b35c08; --always-soft: #fbead6; --always-hatch: #e7b77f;
    --onuse: #0a766c; --onuse-soft: #dbf1ed;
    --warn: #b8392d; --warn-soft: #fbe3df;
    --bar: #c8cdd6; --bar-2: #e4e7ec;
    --ag-claude: #2a78d6; --ag-codex: #e87ba4; --ag-codebuddy: #4a3aa7; --ag-qwen: #008300;
    --shadow: 0 1px 2px rgb(20 22 27 / .06), 0 8px 24px rgb(20 22 27 / .08);
    --shadow-lg: 0 2px 6px rgb(20 22 27 / .08), 0 18px 48px rgb(20 22 27 / .16);
    --font: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", "D2Coding", Consolas, ui-monospace, monospace;
    --fs-xs: 12.5px; --fs-sm: 13.5px; --fs-base: 15px; --fs-md: 17px; --fs-lg: 21px; --fs-xl: 30px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0d0f13; --surface: #15181e; --raised: #1a1e25; --ink: #e9ebf0; --ink-2: #c4c9d2; --muted: #9ba2af; --faint: #6f7683;
      --line: #252a33; --line-2: #343a46; --accent: #9aabff; --accent-soft: #1d2441;
      --always: #f2a54e; --always-soft: #3a2913; --always-hatch: #8c5b25;
      --onuse: #3fc4b5; --onuse-soft: #12302c;
      --warn: #f47c70; --warn-soft: #3b1b18;
      --bar: #3a404b; --bar-2: #262b33;
      --ag-claude: #3987e5; --ag-codex: #d55181; --ag-codebuddy: #9085e9; --ag-qwen: #008300;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .45);
      --shadow-lg: 0 2px 6px rgb(0 0 0 / .5), 0 20px 50px rgb(0 0 0 / .6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0d0f13; --surface: #15181e; --raised: #1a1e25; --ink: #e9ebf0; --ink-2: #c4c9d2; --muted: #9ba2af; --faint: #6f7683;
    --line: #252a33; --line-2: #343a46; --accent: #9aabff; --accent-soft: #1d2441;
    --always: #f2a54e; --always-soft: #3a2913; --always-hatch: #8c5b25;
    --onuse: #3fc4b5; --onuse-soft: #12302c;
    --warn: #f47c70; --warn-soft: #3b1b18;
    --bar: #3a404b; --bar-2: #262b33;
    --ag-claude: #3987e5; --ag-codex: #d55181; --ag-codebuddy: #9085e9; --ag-qwen: #008300;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .45);
    --shadow-lg: 0 2px 6px rgb(0 0 0 / .5), 0 20px 50px rgb(0 0 0 / .6);
    color-scheme: dark;
  }

  /* ---------- base (dashboard) ---------- */
  * { box-sizing: border-box; }
  html { scroll-padding-top: 84px; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: var(--fs-base)/1.65 var(--font); letter-spacing: -0.005em; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { margin: 0; line-height: 1.3; text-wrap: balance; letter-spacing: -0.015em; }
  h2 { font-size: var(--fs-lg); font-weight: 700; }
  h3 { font-size: var(--fs-md); font-weight: 650; }
  p { margin: 0; text-wrap: pretty; }
  code, .mono { font-family: var(--mono); font-size: .92em; }
  code { background: var(--raised); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--ink-2); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn.primary:hover:not(:disabled) { background: var(--ink-2); }
  .link { border: 0; background: none; padding: 0; color: var(--accent); font-size: inherit; font-weight: 600; }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

  .topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .topbar-in { max-width: 1320px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: var(--fs-md); white-space: nowrap; }
  .brand .draft { font-size: 11.5px; font-weight: 650; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 999px; padding: 1px 9px; }
  nav.pages { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  nav.pages a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: var(--fs-sm); padding: 6px 14px; border-radius: 7px; white-space: nowrap; }
  nav.pages a[aria-current="page"] { background: var(--ink); color: var(--paper); }
  nav.pages a:not([aria-current="page"]):hover { color: var(--ink); background: var(--raised); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .stamp { color: var(--faint); font-size: var(--fs-xs); margin-right: 4px; }

  main { max-width: 1320px; margin: 0 auto; padding: 24px 20px 120px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; min-width: 0; }
  .panel-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .lead { color: var(--muted); font-size: var(--fs-sm); max-width: 82ch; }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 650; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 0 8px; line-height: 1.7; white-space: nowrap; }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .seg-ctl { display: inline-flex; background: var(--raised); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg-ctl button { border: 0; background: none; border-radius: 6px; padding: 6px 12px; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
  .seg-ctl button[aria-pressed="true"], .seg-ctl button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .seg-ctl button .n { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  select { font: inherit; font-size: var(--fs-sm); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; }
  .search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: 9px; padding: 0 12px; background: var(--surface); }
  .search:focus-within { border-color: var(--accent); }
  .search input { border: 0; outline: 0; background: none; font: inherit; font-size: var(--fs-sm); padding: 8px 0; width: 100%; color: var(--ink); }
  .search svg { color: var(--faint); flex: none; }
  .flag { display: inline-block; font-size: var(--fs-xs); font-weight: 650; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
  .flag.soft { color: var(--ink-2); background: var(--bar-2); }
  .key { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
  .key.always { background: var(--always); } .key.onuse { background: var(--onuse); } .key.warn { background: var(--warn); } .key.ink { background: var(--ink-2); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
  .dot.auto { background: var(--always); } .dot.manual { background: var(--onuse); } .dot.off { border: 1.5px solid var(--faint); }

  /* agent badge: colored dot for the four color slots, outlined monogram for the rest; the name is always shown */
  .ag { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .ag .m { display: inline-grid; place-items: center; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .ag.plain .m { width: auto; height: 16px; border-radius: 4px; background: none; border: 1px solid var(--line-2); color: var(--muted); font: 700 9.5px/1 var(--mono); padding: 0 3px; letter-spacing: 0; }

  /* ---------- summary cards (dashboard) ---------- */
  .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 1080px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .summary { grid-template-columns: 1fr; } }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
  .stat-label { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); font-weight: 650; color: var(--ink-2); }
  .stat-value { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .stat-value .num { font-size: 26px; font-weight: 700; line-height: 1.15; }
  .stat-value .from { font-family: var(--mono); color: var(--faint); font-size: var(--fs-md); text-decoration: line-through; text-decoration-thickness: 1px; }
  .stat-value .unit { color: var(--muted); font-size: var(--fs-sm); }
  .stat-value .delta { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 650; color: var(--onuse); }
  .stat-note { color: var(--muted); font-size: var(--fs-sm); line-height: 1.55; }
  .stat-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }

  /* ---------- view bar ---------- */
  .viewbar { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
  .viewbar > .lbl { font-size: var(--fs-sm); font-weight: 650; color: var(--ink-2); }
  .viewbar .spacer { flex: 1; }

  /* ---------- workspace: list + change list ---------- */
  .work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
  @media (max-width: 1100px) { .work { grid-template-columns: minmax(0, 1fr); } }

  .agent-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
  .agent-head h2 { display: flex; align-items: center; gap: 10px; }
  .caps { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: var(--fs-sm); margin: 6px 0 14px; }
  .caps b { color: var(--ink-2); font-weight: 650; }
  .scopebar { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; align-items: center; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .scopebar label { font-size: var(--fs-sm); font-weight: 700; color: var(--ink-2); }
  .scopebar .scope-desc { grid-column: 2; font-size: var(--fs-xs); color: var(--muted); }
  .scopebar .scope-desc code { font-size: 11.5px; }
  .scopebar select { max-width: 100%; font-weight: 650; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin: 14px 0 6px; }
  .count { margin-left: auto; color: var(--muted); font-size: var(--fs-sm); }
  .recs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 8px; }
  .recs > span { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; letter-spacing: .02em; }
  .rec { border: 1px dashed var(--line-2); background: none; border-radius: 999px; padding: 5px 13px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); display: inline-flex; gap: 8px; align-items: center; }
  .rec:hover { border-color: var(--accent); color: var(--accent); }
  .rec .tok { font-family: var(--mono); color: var(--onuse); font-weight: 650; }
  .notice { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; border-radius: 10px; padding: 10px 14px; font-size: var(--fs-sm); margin: 6px 0; }
  .notice.warn { background: var(--warn-soft); color: var(--ink); }
  .notice.warn b { color: var(--warn); }
  .notice.ro { background: var(--raised); border: 1px solid var(--line); color: var(--ink-2); }
  .notice.team { background: var(--accent-soft); color: var(--ink); }
  .notice .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

  /* selection bar (replaces the toolbar while rows are selected) */
  .selbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 8px 10px 8px 14px; margin: 14px 0 6px; }
  .selbar b { font-weight: 700; }
  .selbar .scope-note { font-size: var(--fs-xs); opacity: .75; }
  .selbar .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .selbar .btn { background: color-mix(in srgb, var(--paper) 10%, transparent); color: var(--paper); border-color: color-mix(in srgb, var(--paper) 25%, transparent); display: inline-flex; gap: 7px; align-items: center; }
  .selbar .btn:hover { border-color: var(--paper); }
  .selbar .btn:disabled { opacity: .4; }
  .selbar .fallback { display: flex; gap: 12px; align-items: center; font-size: var(--fs-xs); flex-basis: 100%; }
  .selbar .fallback label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }

  /* groups (dashboard ledger) */
  .group { border-top: 1px solid var(--line); }
  .group:first-of-type { border-top: 0; }
  .group > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 14px 2px 10px; }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary .caret { width: 18px; height: 18px; color: var(--faint); transition: transform .15s; flex: none; }
  .group[open] > summary .caret { transform: rotate(90deg); }
  .group > summary h3 { font-size: var(--fs-md); }
  .group > summary .hint { color: var(--muted); font-size: var(--fs-sm); }
  .group > summary .facts { margin-left: auto; display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; }
  .group > summary .facts b { color: var(--ink); font-family: var(--mono); font-weight: 650; }
  .gsel { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

  /* skill rows */
  .rows { display: grid; }
  .srow { display: grid; grid-template-columns: 22px minmax(0, 1.5fr) 74px minmax(290px, auto); gap: 6px 16px; align-items: center; padding: 12px 10px; border-top: 1px solid var(--line); border-radius: 8px; }
  .srow:hover { background: var(--raised); }
  .srow.sel { background: color-mix(in srgb, var(--accent-soft) 75%, var(--surface)); }
  .srow > input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .sk-name { font-family: var(--mono); font-weight: 650; font-size: var(--fs-base); display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
  .sk-sum { color: var(--muted); font-size: var(--fs-sm); line-height: 1.5; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .sk-meta { color: var(--faint); font-size: var(--fs-xs); margin-top: 2px; display: flex; gap: 2px 10px; flex-wrap: wrap; }
  .sk-meta .path { font-family: var(--mono); }
  .tok { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 650; text-align: right; font-size: var(--fs-sm); }
  .tok.always { color: var(--always); }
  .tok.zero { color: var(--faint); font-weight: 400; }
  .tok small { display: block; font-family: var(--font); font-weight: 400; color: var(--faint); font-size: 11px; }
  .srow .extras { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  /* mode segmented control: the one new part */
  .modeseg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; padding: 2px; gap: 2px; background: var(--surface); justify-self: end; }
  .modeseg button { border: 0; background: none; border-radius: 7px; padding: 5px 10px; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; position: relative; }
  .modeseg button:hover:not([aria-disabled="true"]) { color: var(--ink); background: var(--raised); }
  .modeseg button[aria-checked="true"] { color: var(--ink); background: var(--raised); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
  .modeseg button[aria-checked="true"].inh { box-shadow: inset 0 0 0 1.5px var(--line-2); color: var(--ink-2); }
  .modeseg button[aria-disabled="true"] { opacity: .38; cursor: not-allowed; }
  .modeseg button .sub { font-size: 11px; color: var(--faint); font-weight: 500; }
  .modeseg.pending { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .modeseg.drift { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .modeseg.locked button[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--line-2); }
  .modeseg .lock { font-size: 12px; padding: 0 4px 0 6px; align-self: center; }
  .was { font-size: var(--fs-xs); color: var(--faint); text-decoration: line-through; margin-right: 6px; }

  /* exception chips */
  .xchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 2px 10px 2px 8px; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .xchip:hover { border-color: var(--ink-2); }
  .xchip .layer { color: var(--faint); font-weight: 600; }
  .xchip.team { border-style: solid; background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .xchip.team .layer { color: var(--accent); }
  .xchip.pending { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .xchip.drift { border-color: var(--warn); }
  .xchip.unmanaged { border-style: dashed; }
  .xchip.dirty::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 2px; }
  .xadd { border: 1px dashed var(--line-2); background: none; border-radius: 999px; padding: 0 9px; font-size: 11.5px; font-weight: 650; color: var(--muted); line-height: 1.7; }
  .xadd:hover { color: var(--accent); border-color: var(--accent); }

  /* cross-agent table */
  .xtable-wrap { overflow-x: auto; margin: 6px -4px 0; padding: 0 4px; }
  table.xt { width: 100%; border-collapse: collapse; min-width: 860px; }
  table.xt th { text-align: left; font-size: var(--fs-xs); font-weight: 650; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; vertical-align: top; }
  table.xt th .pill { margin-top: 4px; }
  table.xt td.first, table.xt th.first { min-width: 270px; }
  table.xt .sk-name { overflow-wrap: normal; word-break: normal; }
  table.xt td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: var(--fs-sm); }
  table.xt tr:hover td { background: var(--raised); }
  table.xt tr.sel td { background: color-mix(in srgb, var(--accent-soft) 75%, var(--surface)); }
  table.xt td.first, table.xt th.first { position: sticky; left: 0; background: var(--surface); z-index: 1; }
  table.xt tr:hover td.first { background: var(--raised); }
  table.xt tr.sel td.first { background: color-mix(in srgb, var(--accent-soft) 75%, var(--surface)); }
  .xcell { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid transparent; border-radius: 8px; padding: 4px 9px; background: none; font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .xcell:hover:not(:disabled) { border-color: var(--line-2); }
  .xcell.pending { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .xcell.drift { border-color: var(--warn); }

function targets(k, c) {

  const a = agentBy(aid), s = skillBy(a, sid);
  const { p, layer } = parse(scope);

  const after = c.kind === 'adopt' ? (actVal(s, scope) ?? (layer === 'global' ? 'auto' : undefined)) : c.kind === 'revert' ? polVal(s, scope) : c.value === 'inherit' ? undefined : c.value;
  const show = (x, g) => (x === undefined ? (g ? '(없음 = 자동)' : '(없음 = 따름)') : x);
  if (layer !== 'team' && c.kind !== 'revert') {
    const pb = polVal(s, scope);
    if (pb !== after) out.push({ file: a.files.policy, role: 'policy', line: `modes.${a.id}.${layer === 'global' ? 'global' : `projects["${p}"]`}["${key}"]`, from: show(pb, layer === 'global'), to: after === undefined ? '(삭제)' : after });
  }
  if (c.kind !== 'adopt') {
    const file = layer === 'global' ? a.files.global : a.files[layer](p);
    const ab = actVal(s, scope);
    const same = layer === 'global' ? (ab ?? 'auto') === (after ?? 'auto') : ab === after;
    if (!same) {
      const repr = (x) => {
        if (a.id === 'claude' || a.id === 'codebuddy') return x === undefined || (layer === 'global' && x === 'auto') ? '(키 삭제)' : `"${{ auto: 'on', manual: 'user-invocable-only', off: 'off' }[x]}"`;
        if (a.id === 'codex') return x === 'off' ? 'enabled = false' : '(블록 삭제)';
        if (a.id === 'zcode') return x === 'off' ? '{ "enable": false }' : x === 'auto' && layer !== 'global' ? '{ "enable": true }' : '(키 삭제)';
        if (a.id === 'qwen') return x === 'off' ? 'skills.defaultDisabled에 추가' : x === 'auto' && layer !== 'global' ? 'skills.enabled에 추가' : '(목록에서 빼기)';
        return String(x);
      };

      out.push({ file, role: layer === 'team' ? 'team' : 'mine', line: field, from: repr(ab), to: repr(after) });
    }
  }

}

  $('dlg-apply').focus();
}
// ZCode's config is locked while its app runs: the first apply that touches it fails, so the failure path is testable.
function applyStaged() {
  const btn = $('dlg-apply');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>적용 중…';
  $('dlg-body').querySelector('.err')?.remove();
  setTimeout(() => {
    const touchesZ = [...st.staged.keys()].some((k) => k.startsWith('zcode|'));
    if (touchesZ && st.failOnce) {
      st.failOnce = false;
      $('dlg-body').insertAdjacentHTML('afterbegin', `<div class="err" role="alert"><b>~/.zcode/cli/config.json을 쓰지 못했습니다.</b><span>ZCode 앱이 실행 중이라 파일이 잠겨 있습니다. 다른 파일도 모두 원래대로 되돌렸습니다. ZCode를 닫고 다시 시도하세요.</span></div>`);
      btn.disabled = false;
      btn.textContent = '다시 시도';
      btn.focus();
      return;
    }
    st.undo = JSON.stringify(AGENTS.map((a) => a.skills.map((s) => ({ policy: s.policy, actual: s.actual }))));
    const n = st.staged.size;
    const team = new Set();
    for (const [k, c] of st.staged) {
      for (const t of targets(k, c)) if (t.role === 'team') team.add(t.file);
      const [aid, sid, ...rest] = k.split('|');
      const scope = rest.join('|');
      const a = agentBy(aid), s = skillBy(a, sid);
      const { p, layer } = parse(scope);
      const val = c.kind === 'adopt' ? (actVal(s, scope) ?? (layer === 'global' ? 'auto' : undefined)) : c.kind === 'revert' ? polVal(s, scope) : c.value === 'inherit' ? undefined : c.value;
      const put = (obj, x) => { if (layer === 'global') obj.global = x; else if (x === undefined) delete obj[layer][p]; else obj[layer][p] = x; };
      if (layer !== 'team' && c.kind !== 'revert') put(s.policy, val);
      if (c.kind !== 'adopt') put(s.actual, layer === 'global' && val === 'auto' ? undefined : val);
    }
    team.forEach((f) => st.teamDirty.add(f));
    st.staged.clear();
    st.selected.clear();
    $('dlg').close();
    render();
    toast(`${n}건 적용했습니다 · 새 세션부터 반영${team.size ? ` · 팀 파일 ${team.size}개 커밋 필요` : ''}`, true);
  }, 700);
}
function undo() {
  if (!st.undo) return;
  const snap = JSON.parse(st.undo);
  AGENTS.forEach((a, i) => a.skills.forEach((s, j) => Object.assign(s, snap[i][j])));
  st.undo = null;
  st.teamDirty.clear();
  render();
  toast('마지막 적용을 되돌렸습니다');
}
let toastTimer;
function toast(msg, withUndo) {
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${withUndo ? '<button id="undo">되돌리기</button>' : ''}`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 6500);
}

// ============ exception popover (per project and layer) ============
const pop = $('pop');
let popAnchor = null;
function openExc(anchor, sid, scope) {
  const a = A(), s = skillBy(a, sid);
  const projects = a.projects.filter((p) => applies(s, p));
  const pre = scope ? parse(scope) : { p: projects.find((p) => !exceptions(a, s).some((e) => e.p === p)) ?? projects[0], layer: a.layers[0] };
  popAnchor = anchor;
  pop.dataset.skill = sid;
  const draw = (p, layer) => {
    const sc = `${p}|${layer}`;
    const val = cur(a, s, sc);
    const inh = inherited(a, s, sc);
    const mineOver = layer === 'team' && a.layers.includes('mine') && cur(a, s, `${p}|mine`) !== undefined;
    pop.innerHTML = `<h4><span class="mono">${esc(nameOf(s))}</span> 프로젝트 예외</h4>
      <label class="field"><span>프로젝트</span><select id="pp">${projects.map((x) => `<option${x === p ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
      ${a.layers.length > 1 ? `<div class="field"><span>어디에 둘까요</span><div class="layers" role="radiogroup">
        <label><input type="radio" name="pl" value="mine" ${layer === 'mine' ? 'checked' : ''}>나만<small>이 PC · settings.local.json</small></label>
        <label><input type="radio" name="pl" value="team" ${layer === 'team' ? 'checked' : ''}>팀 공유<small>커밋 · settings.json</small></label></div></div>`
        : `<div class="field"><span>저장 위치</span><span style="font-size:var(--fs-xs);color:var(--muted)">${esc(a.files.team(p))} · git에 올리면 팀과 공유</span></div>`}
      <div class="opts" role="radiogroup" aria-label="값">${['inherit', 'auto', 'manual', 'off'].map((o) => {
        const why = whyNot(a, s, sc, o);
        return `<button class="opt" role="radio" aria-checked="${(val ?? 'inherit') === o}" data-v="${o}" ${why ? 'disabled' : ''}>${o === 'inherit' ? '<span></span>' : dot(o)}<span>${o === 'inherit' ? `따름 <span class="hint">(${SHORT[inh]})</span>` : MODE[o]}</span>${why ? `<span class="why">${esc(why)}</span>` : ''}</button>`;
      }).join('')}</div>
      ${mineOver ? `<p class="note">이 PC에는 "나만" 값(${SHORT[cur(a, s, `${p}|mine`)]})이 있어서, 팀 값을 바꿔도 여기서는 나만 값이 이깁니다.</p>` : ''}
      ${layer === 'team' ? '<p class="note">팀 공유 값은 기준값(policy.json)이 아니라 저장소 파일에 바로 씁니다. 적용 뒤 커밋해야 동료에게 갑니다.</p>' : ''}
      <div class="foot"><button class="link" data-close>닫기</button>${val !== undefined ? '<button class="link" data-v="inherit" style="color:var(--warn)">예외 지우기</button>' : ''}</div>`;
    pop.querySelector('#pp').addEventListener('change', (e) => draw(e.target.value, layer));
    for (const r of pop.querySelectorAll('input[name="pl"]')) r.addEventListener('change', (e) => draw(p, e.target.value));
    pop.dataset.scope = sc;
  };
  draw(pre.p, pre.layer);
  place(anchor);
  (pop.querySelector('.opt[aria-checked="true"]:not(:disabled)') ?? pop.querySelector('.opt:not(:disabled)'))?.focus();
}
function openCross(anchor, aid, name) {
  const a = agentBy(aid);
  const copies = a.skills.filter((s) => nameOf(s) === name);
  const s = copies[0];
  popAnchor = anchor;
  pop.dataset.xagent = aid;
  pop.dataset.xname = name;
  const val = cur(a, s, 'global') ?? defaultOf(s);
  pop.innerHTML = `<h4>${agentBadge(a)} <span class="mono">${esc(name)}</span></h4>
    ${copies.length > 1 ? `<p class="note" style="border:0;padding:0">사본 ${copies.length}개를 모두 바꿉니다. 하나만 바꾸려면 에이전트별 보기에서 고르세요.</p>` : ''}
    <div class="opts" role="radiogroup" aria-label="전역 기본값">${['auto', 'manual', 'off'].map((o) => {
      const why = whyNot(a, s, 'global', o);
      return `<button class="opt" role="radio" aria-checked="${val === o}" data-xv="${o}" ${why ? 'disabled' : ''}>${dot(o)}<span>${MODE[o]}</span>${why ? `<span class="why">${esc(why)}</span>` : ''}</button>`;
    }).join('')}</div>
    <div class="foot"><button class="link" data-close>닫기</button><button class="link" data-goto="${aid}">에이전트별 보기로 →</button></div>`;
  place(anchor);
  (pop.querySelector('.opt[aria-checked="true"]:not(:disabled)') ?? pop.querySelector('.opt:not(:disabled)'))?.focus();
}
function place(anchor) {
  pop.hidden = false;
  const r = anchor.getBoundingClientRect(), b = pop.getBoundingClientRect();
  let top = r.bottom + 6;
  if (top + b.height > innerHeight - 8) top = Math.max(8, r.top - b.height - 6);
  pop.style.top = `${top}px`;
  pop.style.left = `${Math.min(Math.max(8, r.left), innerWidth - b.width - 8)}px`;
}
function closePop(refocus = true) {
  if (pop.hidden) return;
  pop.hidden = true;
  delete pop.dataset.xagent;
  const a = popAnchor;
  popAnchor = null;
  if (refocus && a?.isConnected) a.focus();
}

// ============ events ============
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('#pop')) {
    if (t.closest('[data-close]')) return closePop();
    const g = t.closest('[data-goto]');
    if (g) { st.view = 'agent'; st.agent = g.dataset.goto; st.selected.clear(); closePop(false); return render(); }
    const xv = t.closest('[data-xv]');
    if (xv) {
      const a = agentBy(pop.dataset.xagent);
      for (const s of a.skills.filter((x) => nameOf(x) === pop.dataset.xname)) trySet(a, s, 'global', xv.dataset.xv);
      const anchorSel = `[data-xagent="${a.id}"][data-xname="${CSS.escape(pop.dataset.xname)}"]`;
      closePop(false); render(); document.querySelector(anchorSel)?.focus(); return;
    }
    const ov = t.closest('.opt[data-v], .foot [data-v]');
    if (ov && !ov.disabled) {
      const a = A(), s = skillBy(a, pop.dataset.skill);
      trySet(a, s, pop.dataset.scope, ov.dataset.v);
      closePop(false); render();
      document.querySelector(`[data-row="${CSS.escape(s.id)}"] .xadd, [data-row="${CSS.escape(s.id)}"] .xchip`)?.focus();
      return;
    }
    return;
  }
  if (!t.closest('#pop') && !pop.hidden) closePop(false);
  const soon = t.closest('[data-soon]');
  if (soon) { e.preventDefault(); return toast(`${soon.dataset.soon}은 지금 대시보드의 페이지입니다. 시안에서는 호출 방식 페이지만 만들었습니다.`); }
  const view = t.closest('[data-view]');
  if (view) { st.view = view.dataset.view; st.filter = 'all'; st.selected.clear(); st.q = ''; return render(); }
  const ag = t.closest('[data-agent]');
  if (ag) { st.agent = ag.dataset.agent; st.scope = 'global'; st.filter = 'all'; st.selected.clear(); return render(); }
  const f = t.closest('[data-filter]');
  if (f) { st.filter = f.dataset.filter; if (f.closest('.empty-state')) st.q = ''; return render(); }
  const seg = t.closest('.modeseg [data-set]');
  if (seg) {
    if (seg.getAttribute('aria-disabled') === 'true') return toast(seg.dataset.tip || '고를 수 없는 값입니다');
    const a = A(), s = skillBy(a, seg.closest('.modeseg').dataset.skill);
    trySet(a, s, st.scope, seg.dataset.set); render();
    document.querySelector(`[data-row="${CSS.escape(s.id)}"] .modeseg [aria-checked="true"]`)?.focus();
    return;
  }
  const exc = t.closest('[data-exc]');
  if (exc) { e.stopPropagation(); return openExc(exc, exc.dataset.exc, exc.dataset.scope); }
  const xc = t.closest('[data-xagent]');
  if (xc && !xc.closest('#pop')) { if (xc.classList.contains('locked')) return toast(xc.dataset.tip); return openCross(xc, xc.dataset.xagent, xc.dataset.xname); }
  const rec = t.closest('[data-rec]');
  if (rec) {
    const a = A(); let n = 0;
    const to = a.modes.includes('manual') ? 'manual' : 'off';
    for (const s of a.skills) if ((rec.dataset.rec === 'idle' ? isIdle(a, s) : s.extra) && trySet(a, s, 'global', rec.dataset.rec === 'idle' ? to : 'off')) n++;
    st.filter = 'pending'; render(); return toast(`${n}건을 변경 목록에 넣었습니다`);
  }
  const dr = t.closest('[data-drift]');
  if (dr) {
    const list = st.view === 'agent' ? [A()] : AGENTS;
    if (dr.dataset.drift === 'view') { if (st.view !== 'agent') { st.view = 'agent'; st.agent = AGENTS.find((a) => a.skills.some((s) => isDrift(a, s)))?.id ?? st.agent; } st.filter = 'drift'; return render(); }
    for (const a of list) for (const s of a.skills) for (const sc of ['global', ...a.projects.map((p) => `${p}|mine`)]) if (drifted(s, sc)) stage(a, s, sc, { kind: dr.dataset.drift });
    return render();
  }
  const bulk = t.closest('[data-bulk]');
  if (bulk) {
    const a = A(); let n = 0, skip = 0;
    for (const id of st.selected) { const s = skillBy(a, id); if (!s) continue; if (trySet(a, s, st.scope, bulk.dataset.bulk)) n++; else skip++; }
    st.selected.clear(); render(); return toast(`${n}건을 변경 목록에 넣었습니다${skip ? ` · 바꿀 수 없는 ${skip}개는 건너뜀` : ''}`);
  }
  const xb = t.closest('[data-xbulk]');
  if (xb) {
    let n = 0, skip = 0, fell = 0;
    for (const name of st.selected) for (const a of AGENTS) for (const s of a.skills.filter((x) => nameOf(x) === name)) {
      let m = xb.dataset.xbulk;
      if (m === 'manual' && !a.readOnly && !a.modes.includes('manual')) { if (st.fallback === 'off') { m = 'off'; fell++; } else { skip++; continue; } }
      if (trySet(a, s, 'global', m)) n++; else skip++;
    }
    st.selected.clear(); render();
    return toast(`${n}건을 변경 목록에 넣었습니다${fell ? ` · ${fell}건은 꺼짐으로` : ''}${skip ? ` · ${skip}건은 건너뜀` : ''}`);
  }
  if (t.closest('[data-clear-sel]')) { st.selected.clear(); return render(); }
  const un = t.closest('[data-unstage]');
  if (un) { st.staged.delete(un.dataset.unstage); render(); return $('cart').querySelector('.x, #discard, h2')?.focus?.(); }
  if (t.id === 'discard') { st.staged.clear(); st.cartOpen = false; return render(); }
  if (t.id === 'preview' || t.id === 'preview2') return openPreview();
  if (t.id === 'cart-toggle') { st.cartOpen = !st.cartOpen; return renderCart(); }
  if (t.id === 'dlg-cancel') return $('dlg').close();
  if (t.id === 'dlg-apply') return applyStaged();
  if (t.id === 'undo') { $('toast').hidden = true; return undo(); }
  if (t.id === 'copy-git') {
    const files = [...st.teamDirty];
    const cmd = `git add ${files.join(' ')} && git commit -m "chore: 스킬 호출 방식 팀 설정"`;
    navigator.clipboard?.writeText(cmd).then(() => toast('git 명령을 복사했습니다'), () => toast(cmd));
    return;
  }
});
let shiftHeld = false;
document.addEventListener('pointerdown', (e) => { shiftHeld = e.shiftKey; }, true);
document.addEventListener('keydown', (e) => { if (e.key === ' ') shiftHeld = e.shiftKey; }, true);
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'scope') { st.scope = t.value; return render(); }
  if (t.name === 'fb') { st.fallback = t.value; return; }
  if (t.dataset.sel) {
    const a = A(), rows = visible(a), i = Number(t.dataset.i);
    if (shiftHeld && st.lastIdx !== null) for (let j = Math.min(i, st.lastIdx); j <= Math.max(i, st.lastIdx); j++) t.checked ? st.selected.add(rows[j].id) : st.selected.delete(rows[j].id);
    else t.checked ? st.selected.add(t.dataset.sel) : st.selected.delete(t.dataset.sel);
    st.lastIdx = i; render();
    return document.querySelector(`[data-sel="${CSS.escape(t.dataset.sel)}"]`)?.focus();
  }
  if (t.dataset.gsel) { for (const s of A().skills.filter((x) => x.cat === t.dataset.gsel && visible(A()).includes(x))) t.checked ? st.selected.add(s.id) : st.selected.delete(s.id); return render(); }
  if (t.dataset.xsel) { t.checked ? st.selected.add(t.dataset.xsel) : st.selected.delete(t.dataset.xsel); render(); return document.querySelector(`[data-xsel="${CSS.escape(t.dataset.xsel)}"]`)?.focus(); }
  if (t.id === 'xsel-all') { for (const r of crossRows()) t.checked ? st.selected.add(r.name) : st.selected.delete(r.name); return render(); }
});
// The group checkbox sits inside <summary>; keep it from toggling the group open/closed.
document.addEventListener('click', (e) => { if (e.target.matches('summary .gsel')) e.stopPropagation(); }, true);
document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  st.q = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const q = $('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !pop.hidden) { e.preventDefault(); return closePop(); }
  // Radio-group arrows inside a mode control: move and choose, like native radios.
  const seg = e.target.closest?.('.modeseg');
  if (seg && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    e.preventDefault();
    const btns = [...seg.querySelectorAll('[data-set]:not([aria-disabled="true"])')];
    const i = btns.indexOf(document.activeElement);
    const next = btns[(i + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1) + btns.length) % btns.length];
    next?.click();
    return;
  }
  if (!pop.hidden && pop.contains(e.target) && ['ArrowDown', 'ArrowUp'].includes(e.key)) {
    e.preventDefault();
    const opts = [...pop.querySelectorAll('.opt:not(:disabled)')];
    const i = opts.indexOf(document.activeElement);
    opts[(i + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length]?.focus();
  }
});
$('dlg').addEventListener('close', () => $('preview')?.focus() ?? $('preview2')?.focus());

// tooltip on hover and focus
const tip = $('tip');
function showTip(el) {
  if (!el.dataset.tip) return;
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const r = el.getBoundingClientRect(), b = tip.getBoundingClientRect();
  tip.style.top = `${r.top - b.height - 8 < 8 ? r.bottom + 8 : r.top - b.height - 8}px`;
  tip.style.left = `${Math.min(Math.max(8, r.left + r.width / 2 - b.width / 2), innerWidth - b.width - 8)}px`;
}
document.addEventListener('pointerover', (e) => { const el = e.target.closest('[data-tip]'); if (el && pop.hidden) showTip(el); });
document.addEventListener('pointerout', (e) => { if (e.target.closest('[data-tip]')) tip.hidden = true; });
document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip]'); if (el && pop.hidden) showTip(el); else tip.hidden = true; });
addEventListener('scroll', () => { tip.hidden = true; if (!pop.hidden) closePop(false); }, true);

// theme
const THEMES = ['auto', 'light', 'dark'], TL = { auto: '자동', light: '밝게', dark: '어둡게' };
let theme = 'auto';
$('theme').addEventListener('click', () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = theme;
  $('theme').textContent = `테마: ${TL[theme]}`;
});

render();
// Loading state: the real page reads settings files and transcripts first.
setTimeout(() => { st.loading = false; render(); }, 450);
